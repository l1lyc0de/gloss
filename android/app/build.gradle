plugins { id 'com.android.application' }

// 签名信息不进仓库：口令和密钥放在 android/keystore.properties（已 gitignore）。
// 文件不在也能构建 —— 那样 release 就是未签名的，assembleDebug 照常可用。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

// 更新地址同理，也不进仓库 —— 这个仓库是公开的，站点地址属于部署信息。
// 文件不在就是空串，「检查更新」入口整个不出现（和「服务器上没放包时
// 网页版不露下载入口」是同一条规矩：不留一个点下去没反应的按钮）。
def siteProps = new Properties()
def sitePropsFile = rootProject.file('site.properties')
if (sitePropsFile.exists()) sitePropsFile.withInputStream { siteProps.load(it) }
def updateUrl = siteProps.getProperty('updateUrl', '')

android {
    namespace 'com.lilycode.gloss'
    compileSdk 34

    defaultConfig {
        applicationId "com.lilycode.gloss"
        minSdk 26
        targetSdk 34
        versionCode 3
        // 三段式。versionCode 是给系统比大小的整数，versionName 是给人看的，
        // 两者各管各的 —— 改 versionName 时别忘了 versionCode 也要涨，
        // 不涨的话系统认为不是新版，装不上去。
        versionName "1.2.0"

        buildConfigField "String", "UPDATE_URL", "\"${updateUrl}\""
    }

    // 只为了 BuildConfig.UPDATE_URL —— AGP 8 起这个开关默认是关的
    buildFeatures {
        buildConfig true
    }

    // 网页版就是这个 App 的全部内容。assets 直接指向 gloss/public，
    // 仓库里不留第二份 30 MB 的词典 —— 改一行网页代码重新打包就带上了，
    // 不存在「壳里的版本忘了同步」这种问题。
    sourceSets {
        main { assets.srcDirs = ['../../public'] }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // 壳统共一个 Activity，没什么可缩的；assets 里的 JS 更不该被任何工具碰。
            minifyEnabled false
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // androidx.activity 带的 kotlin-stdlib 1.8 和传递依赖里的 kotlin-stdlib-jdk8 1.6
    // 会撞出一屏 Duplicate class（1.8 起 jdk7/jdk8 已经并进 stdlib 了）。
    // 用 kotlin-bom 把所有 kotlin 模块对齐到同一个版本，这一行是必需的。
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')

    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.activity:activity:1.9.3'
}
